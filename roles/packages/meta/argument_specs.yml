---
argument_specs:
  main:
    short_description: Configure package sources, upgrade packages, and set up unattended-upgrades
    options:
      packages_upgrade:
        type: str
        default: dist
        choices:
          - "no"
          - safe
          - "yes"
          - full
          - dist
        description: "Package upgrade mode applied to all packages; 'no' skips the upgrade"
      packages_enable_auto_upgrades:
        type: bool
        default: true
        description: "Configure unattended-upgrades (Debian) or dnf-automatic (RedHat) for automatic package upgrades"
      packages_enable_repos_main:
        type: bool
        default: true
        description: "Enable the main apt repository pocket (Debian only)"
      packages_enable_repos_updates:
        type: bool
        default: true
        description: "Enable the updates apt repository pocket (Debian only)"
      packages_enable_repos_backports:
        type: bool
        default: true
        description: "Enable the backports apt repository pocket (Debian only)"
      packages_enable_repos_security:
        type: bool
        default: true
        description: "Enable the security apt repository pocket (Debian only)"
      packages_enable_components_contrib:
        type: bool
        default: true
        description: "Enable the contrib component (Debian only)"
      packages_enable_components_non_free:
        type: bool
        default: true
        description: "Enable the non-free component (Debian only)"
      packages_enable_components_non_free_firmware:
        type: bool
        default: true
        description: "Enable the non-free-firmware component (Debian only)"
      packages_enable_deb_src:
        type: bool
        default: true
        description: "Include deb-src entries for all enabled repository pockets (Debian only)"
