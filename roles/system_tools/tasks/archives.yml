---
- name: Install archive utilities (Debian)
  ansible.builtin.package:
    name:
      - zip
      - unzip
      - bzip2
      - attr
      - dtrx
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install archive utilities (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y zip unzip bzip2 attr
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_archives
  changed_when: "'Nothing to do' not in dnf_install_archives.stdout"
