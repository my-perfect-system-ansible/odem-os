---
- name: Install file transfer tools via package module
  ansible.builtin.package:
    name:
      - curl
      - wget
      - rsync
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install file transfer tools via dnf CLI
  ansible.builtin.command: dnf install -y curl wget rsync
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_transfer
  changed_when: "'Nothing to do' not in dnf_install_transfer.stdout"
