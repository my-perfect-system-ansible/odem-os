---
- name: Install network diagnostic tools (Debian)
  ansible.builtin.package:
    name:
      - net-tools
      - bind9-dnsutils
      - bridge-utils
      - iptables
      - tcpdump
      - traceroute
      - netcat-traditional
      - nmap
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install network diagnostic tools (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y net-tools bind-utils bridge-utils iptables tcpdump traceroute nmap-ncat nmap
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_net
  changed_when: "'Nothing to do' not in dnf_install_net.stdout"
