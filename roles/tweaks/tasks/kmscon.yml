---
# kmscon — userspace console (replaces the kernel vt). Debian: kmscon +
# libtsm4 from trixie-backports; RedHat: kmscon via dnf.

- name: Install kmscon packages (Debian)
  ansible.builtin.package:
    name: "{{ tweaks_kmscon_packages }}"
    state: present
    default_release: "{{ tweaks_kmscon_default_release }}"
    update_cache: true
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Install kmscon packages (RedHat via dnf CLI)
  ansible.builtin.command: dnf install -y kmscon
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_kmscon
  changed_when: "'Nothing to do' not in dnf_install_kmscon.stdout"
  become: true

- name: Ensure kmscon config directory exists
  ansible.builtin.file:
    path: "{{ tweaks_kmscon_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true

- name: Deploy kmscon configuration file
  ansible.builtin.copy:
    src: "{{ tweaks_kmscon_conf_src }}"
    dest: "{{ tweaks_kmscon_conf_dst }}"
    owner: root
    group: root
    mode: "0644"
  become: true