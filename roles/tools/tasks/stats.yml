---
- name: Install system statistics tools via package module
  ansible.builtin.package:
    name:
      - htop
      - iftop
      - sysstat
      - fio
    state: present
  when: ansible_facts['os_family'] == 'Debian'

- name: Install system statistics tools via dnf CLI
  ansible.builtin.command: dnf install -y htop iftop sysstat fio
  when: ansible_facts['os_family'] == 'RedHat'
  register: dnf_install_stats
  changed_when: "'Nothing to do' not in dnf_install_stats.stdout"
