---
- name: Assert at least one repository pocket is enabled
  ansible.builtin.assert:
    that:
      - >-
        package_manager_enable_repos_main | bool
        or package_manager_enable_repos_updates | bool
        or package_manager_enable_repos_backports | bool
        or package_manager_enable_repos_security | bool
    fail_msg: "At least one apt repository pocket must be enabled"
    quiet: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Render apt sources.list
  ansible.builtin.template:
    src: apt/sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: "0644"
  when: ansible_facts['os_family'] == 'Debian'

- name: Update package cache
  ansible.builtin.package:
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Update package cache via dnf CLI
  ansible.builtin.command: dnf makecache
  when: ansible_facts['os_family'] == 'RedHat'
  changed_when: true

- name: Perform configured package upgrade
  ansible.builtin.package:
    upgrade: "{{ package_manager_upgrade }}"
  when:
    - ansible_facts['os_family'] == 'Debian'
    - package_manager_upgrade != "no"

- name: Upgrade packages via dnf CLI
  ansible.builtin.command: dnf upgrade -y
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - package_manager_upgrade != "no"
  changed_when: "'Nothing to do' not in dnf_upgrade_cli.stdout"
  register: dnf_upgrade_cli
